# =============================================================================
# Production Docker Compose - Security Hardened
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NGINX - Reverse Proxy & TLS Termination
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-ssl-certs:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - myjob-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # ---------------------------------------------------------------------------
  # POSTGRES - Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - myjob-net

  # ---------------------------------------------------------------------------
  # REDIS - Cache & Session Store
  # ---------------------------------------------------------------------------
  redis:
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myjob-net

  # ---------------------------------------------------------------------------
  # API - Backend Application Server
  # ---------------------------------------------------------------------------
  api:
    restart: unless-stopped
    ports: []  # Internal only — nginx proxies external traffic
    environment:
      APP_ENV: production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - myjob-net

  # ---------------------------------------------------------------------------
  # WORKER - Background Job Processor
  # ---------------------------------------------------------------------------
  worker:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - myjob-net

  # ---------------------------------------------------------------------------
  # BROWSER-AGENT - Headless Chromium Automation
  # ---------------------------------------------------------------------------
  browser-agent:
    restart: unless-stopped
    ports: []  # Internal only — nginx proxies /browser/ internally
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - myjob-net

  # ---------------------------------------------------------------------------
  # FRONTEND - Static Asset Server / SSR
  # ---------------------------------------------------------------------------
  frontend:
    restart: unless-stopped
    ports: []  # Internal only — nginx proxies external traffic
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - myjob-net

  # ---------------------------------------------------------------------------
  # LIVEKIT - Real-Time Communication Server
  # ---------------------------------------------------------------------------
  livekit:
    restart: unless-stopped
    ports: []  # Internal only — nginx proxies WebSocket at /livekit
    security_opt:
      - no-new-privileges:true
    networks:
      - myjob-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  nginx-ssl-certs:
    driver: local
  nginx-logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  myjob-net:
    driver: bridge
