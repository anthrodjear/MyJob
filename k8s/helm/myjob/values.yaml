# values.yaml — AI Job Search Agent Helm Chart
# Override per environment in overlays/staging/values.yaml or overlays/production/values.yaml

# -- Global settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets:
    - name: ghcr-secret
  storageClass: standard

# -- Namespace
namespace: myjob

# -- API Server
api:
  enabled: true
  replicaCount: 1
  image:
    repository: anthrodjear/myjob-api
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  healthCheck:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  env:
    APP_ENV: production
    PORT: "8080"
    CONFIG_PATH: /app/config/application.yaml
    QUEUE_CONCURRENCY: "10"
    RATE_LIMIT_RPM: "120"
    RATE_LIMIT_BURST: "20"
    CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://192.168.2.102:3000,http://192.168.2.102"
    LLM_PRIMARY_PROVIDER: ollama
    LLM_FALLBACK_PROVIDER: ollama
    VOICE_PROVIDER: ollama
    OLLAMA_MODEL: nemotron-3-super:cloud
    OLLAMA_EMBED_MODEL: granite-embedding:latest
    EMAIL_FOLDERS: "Inbox,Jobs,Applications"

# -- Worker Service
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: anthrodjear/myjob-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    APP_ENV: production
    QUEUE_CONCURRENCY: "10"
    CONFIG_PATH: /app/config/application.yaml
    LLM_PRIMARY_PROVIDER: ollama
    LLM_FALLBACK_PROVIDER: ollama
    OLLAMA_MODEL: nemotron-3-super:cloud
    OLLAMA_EMBED_MODEL: granite-embedding:latest

# -- Browser Agent
browserAgent:
  enabled: true
  replicaCount: 1
  image:
    repository: anthrodjear/myjob-browser-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  env:
    LOG_LEVEL: info

# -- Frontend (Next.js)
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: anthrodjear/myjob-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    NODE_ENV: production
    NEXT_PUBLIC_API_URL: "/api"
    SESSION_SECRET: ""  # From secret
    BACKEND_URL: "http://api:8080"

# -- PostgreSQL
postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    POSTGRES_DB: myjob
    POSTGRES_USER: myjob

# -- Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# -- Ingress
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: 192.168.2.102
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 3000
        - path: /api
          pathType: Prefix
          service: api
          port: 8080
        - path: /livekit
          pathType: Prefix
          service: livekit
          port: 7880
  tls:
    - secretName: myjob-tls
      hosts:
        - 192.168.2.102

# -- Secrets (reference existing K8s secrets)
secrets:
  database:
    secretName: myjob-database
    keys:
      password: POSTGRES_PASSWORD
  auth:
    secretName: myjob-auth
    keys:
      jwtSecret: AUTH_JWT_SECRET
      passwordHash: AUTH_PASSWORD_HASH
      sessionSecret: SESSION_SECRET
  livekit:
    secretName: myjob-livekit
    keys:
      apiKey: LIVEKIT_API_KEY
      apiSecret: LIVEKIT_API_SECRET
  redis:
    secretName: myjob-redis
    keys:
      password: REDIS_PASSWORD
  llm:
    secretName: myjob-llm
    keys:
      openaiApiKey: OPENAI_API_KEY
      anthropicApiKey: ANTHROPIC_API_KEY
  microsoft:
    secretName: myjob-microsoft
    keys:
      tenantId: MS_TENANT_ID
      clientId: MS_CLIENT_ID
      clientSecret: MS_CLIENT_SECRET

# -- Ollama (external service, override per environment)
ollama:
  baseUrl: "http://ollama.ollama.svc.cluster.local:11434"

# -- LiveKit
livekit:
  enabled: true
  apiKey: ""
  apiSecret: ""
  image:
    repository: livekit/livekit-server
    tag: "v1.7.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 7880
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Monitoring (Prometheus + Grafana)
monitoring:
  enabled: true
  prometheus:
    image:
      repository: prom/prometheus
      tag: "v2.53.0"
    storage: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  grafana:
    image:
      repository: grafana/grafana
      tag: "11.1.0"
    adminPassword: "admin"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

# -- Network Policy
networkPolicy:
  enabled: true

# -- Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# -- Service Account
serviceAccount:
  create: true
  name: myjob
  annotations: {}
