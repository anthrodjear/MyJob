{{- if .Values.livekit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
data:
  livekit.yaml: |
    port: 7880
    rtc:
      port_range_start: 50000
      port_range_end: 60000
      tcp_port: 7881
    logging:
      level: info
{{- end }}
