apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
data:
  application.yaml: |
    server:
      port: 8080
    database:
      max_open_conns: 25
      max_idle_conns: 5
    redis:
      max_memory: 256mb
      max_memory_policy: allkeys-lru
