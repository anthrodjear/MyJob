apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: 5Gi
