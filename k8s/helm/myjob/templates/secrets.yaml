{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.database.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.secrets.database.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.auth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
type: Opaque
data:
  AUTH_JWT_SECRET: {{ .Values.secrets.auth.jwtSecret | b64enc | quote }}
  AUTH_PASSWORD_HASH: {{ .Values.secrets.auth.passwordHash | b64enc | quote }}
  SESSION_SECRET: {{ .Values.secrets.auth.sessionSecret | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.redis.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.livekit.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
type: Opaque
data:
  LIVEKIT_API_KEY: {{ .Values.secrets.livekit.apiKey | b64enc | quote }}
  LIVEKIT_API_SECRET: {{ .Values.secrets.livekit.apiSecret | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.llm.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
type: Opaque
data:
  OPENAI_API_KEY: {{ .Values.secrets.llm.openaiApiKey | b64enc | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.llm.anthropicApiKey | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.microsoft.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myjob.labels" . | nindent 4 }}
type: Opaque
data:
  MS_TENANT_ID: {{ .Values.secrets.microsoft.tenantId | b64enc | quote }}
  MS_CLIENT_ID: {{ .Values.secrets.microsoft.clientId | b64enc | quote }}
  MS_CLIENT_SECRET: {{ .Values.secrets.microsoft.clientSecret | b64enc | quote }}
{{- end }}
